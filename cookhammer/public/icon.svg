<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141019"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fe2c55"/>
      <stop offset="1" stop-color="#ff5c7e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Shopping bag -->
  <g filter="url(#glow)">
    <path d="M150 196 h212 l-16 180 a40 40 0 0 1 -40 36 H206 a40 40 0 0 1 -40 -36 Z"
          fill="none" stroke="url(#bag)" stroke-width="20" stroke-linejoin="round"/>
    <path d="M196 196 v-14 a60 60 0 0 1 120 0 v14"
          fill="none" stroke="url(#bag)" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- TikTok-style note inside the bag (cyan + pink offset + white top) -->
  <g filter="url(#glow)">
    <path d="M284 250 v74 a30 30 0 1 1 -22 -29 v-30 c14 14 28 16 40 16 v-20 c-10 0 -18 -4 -18 -16 Z" fill="#25f4ee"/>
    <path d="M280 246 v74 a30 30 0 1 1 -22 -29 v-30 c14 14 28 16 40 16 v-20 c-10 0 -18 -4 -18 -16 Z" fill="#fe2c55" opacity="0.9"/>
    <path d="M282 248 v74 a30 30 0 1 1 -22 -29 v-30 c14 14 28 16 40 16 v-20 c-10 0 -18 -4 -18 -16 Z" fill="#ffffff"/>
  </g>
</svg>
